# Builds the release exe from the tagged public source and publishes it with a SHA256 file
# and a build provenance attestation, so a download can be traced back to this workflow
# and this source. Runs when a tag like v0.1.1 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Same fixed Rust version as ci.yml.
  RUST_VERSION: "1.99.1"

# Actions are pinned to a full commit id (the version is in the comment): a tag can be
# moved to other code later, a commit id cannot.
jobs:
  # Compiles with read-only rights: nothing that runs during the build can publish anything.
  # Nothing is published unless lint, tests and the dependency audit pass here, on the
  # tagged source itself.
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: /usr/lib/wine/wine64
      WINEDEBUG: "-all"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 wine64
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy
      - run: rustup default ${{ env.RUST_VERSION }}
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo clippy --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo test --locked --target x86_64-pc-windows-gnu
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - run: python3 tools/check_imports.py target/x86_64-pc-windows-gnu/release/desktop-stacks.exe
      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/desktop-stacks.exe dist/DesktopStacks.exe
          cd dist
          sha256sum DesktopStacks.exe > DesktopStacks.exe.sha256
          cat DesktopStacks.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Only this job may write: it attests and publishes exactly the files built above.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: sha256sum --check DesktopStacks.exe.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: DesktopStacks.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DesktopStacks.exe DesktopStacks.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
