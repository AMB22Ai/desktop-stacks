# Builds the release exe from the tagged public source and publishes it with a SHA256 file
# and a build provenance attestation, so a download can be traced back to this workflow
# and this source. Runs when a tag like v0.1.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Compiles with read-only rights: nothing that runs during the build can publish anything.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - run: python3 tools/check_imports.py target/x86_64-pc-windows-gnu/release/desktop-stacks.exe
      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/desktop-stacks.exe dist/DesktopStacks.exe
          cd dist
          sha256sum DesktopStacks.exe > DesktopStacks.exe.sha256
          cat DesktopStacks.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Only this job may write: it attests and publishes exactly the files built above.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: sha256sum --check DesktopStacks.exe.sha256
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: DesktopStacks.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DesktopStacks.exe DesktopStacks.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
