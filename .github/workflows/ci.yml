# Checks every push and pull request: lint, tests, both toolchains, dependency audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC) lint, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup default stable
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python tools/check_imports.py target/release/desktop-stacks.exe

  cross:
    name: Linux cross-build (MinGW) and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - run: python3 tools/check_imports.py target/x86_64-pc-windows-gnu/release/desktop-stacks.exe
      - run: cargo install cargo-audit --locked
      - run: cargo audit
