# Static C runtime: the exe needs no extra DLLs.
# Windows (MSVC toolchain):   cargo build --release
# Linux cross-build (MinGW):  cargo build --release --target x86_64-pc-windows-gnu
#                             python3 tools/check_imports.py target/x86_64-pc-windows-gnu/release/desktop-stacks.exe
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
